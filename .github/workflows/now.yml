name: Update now.json

on:
  schedule:
    - cron: "17 * * * *" # hourly
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find most recently pushed repo
        env:
          GH_TOKEN: ${{ secrets.NOW_TOKEN }}
        run: |
          gh api "user/repos?sort=pushed&per_page=10" --jq '
            [.[] | select(.name != "edenreb.github.io")][0]
            | if .private
              then {name: "a private project", url: null, pushed_at}
              else {name, url: .html_url, pushed_at}
              end' > now.json
          cat now.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add now.json
          git diff --cached --quiet || { git commit -m "Update now.json"; git push; }
