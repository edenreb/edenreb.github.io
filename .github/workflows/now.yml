name: Update now.json

on:
  schedule:
    - cron: "17 * * * *" # hourly
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find most recently pushed repo
        env:
          # NOW_TOKEN (fine-grained, Metadata: read) also sees private repos;
          # without it we fall back to the public repo list
          NOW_TOKEN: ${{ secrets.NOW_TOKEN }}
          GH_TOKEN: ${{ secrets.NOW_TOKEN || github.token }}
        run: |
          if [ -n "$NOW_TOKEN" ]; then ENDPOINT="user/repos"; else ENDPOINT="users/${{ github.repository_owner }}/repos"; fi
          gh api "$ENDPOINT?sort=pushed&per_page=10" --jq '
            [.[] | select(.name != "edenreb.github.io")][0]
            | if .private
              then {name: "a private project", url: null, pushed_at}
              else {name, url: (if (.homepage // "") != "" then .homepage else .html_url end), pushed_at}
              end' > now.json
          cat now.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add now.json
          git diff --cached --quiet || { git commit -m "Update now.json"; git push; }
